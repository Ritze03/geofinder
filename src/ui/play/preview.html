<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geofinder Play preview</title>
    <style>:root { --play-h: calc(100vh - 60px); } #pv-log:empty { display: none; }</style>
  </head>
  <body>
    <!-- Dev harness: `npx vite`, then open http://localhost:5173/src/ui/play/preview.html#host (or #player, #captures, #leak, #countdown, #low, #chat, #away) -->
    <nav id="pv-nav" style="display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #34344f"></nav>
    <div id="pv-stage"></div>
    <pre id="pv-log" style="margin:16px;padding:10px 14px;background:#13131e;border:1px solid #34344f;border-radius:12px;max-height:140px;overflow:auto;font:12px/1.5 ui-monospace,monospace;color:#9d9cbc"></pre>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
