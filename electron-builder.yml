# install.sh runs: electron-builder --linux --dir (unpacked app, no installer).
# npm run dist adds --linux AppImage --win portable into build/release (output set on the CLI).
appId: net.ritze03.geofinder
productName: Geofinder
executableName: geofinder
directories:
  output: build/pack
files:
  - dist/**
  - electron/**
  - src/contracts.js
  - package.json
  - "!electron/*.test.js"
npmRebuild: false
electronDist: node_modules/electron/dist
linux:
  target: dir
  category: Game
  icon: icon.png
win:
  target: portable
  icon: icon.png
portable:
  artifactName: ${productName}-${version}-portable.exe
appImage:
  artifactName: ${productName}-${version}.AppImage
